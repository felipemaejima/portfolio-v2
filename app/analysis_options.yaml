include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/api/**          # gerado pelo swagger_parser/build_runner (make app-gen)
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - directives_ordering
    - sort_pub_dependencies
