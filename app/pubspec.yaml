name: portfolio_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  cached_network_image: ^4.0.0
  # material_ui 1.3.0 / cupertino_ui 1.1.0 (15/09/2026) usam APIs que o Flutter
  # 3.44.0 não reexporta (@awaitNotRequired) e quebram o build web apesar da
  # constraint ">=3.44.0". Teto até subir o FLUTTER_VERSION.
  cupertino_ui: ">=1.0.0 <1.1.0"
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.1.1
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  image_picker: ^1.2.3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  material_ui: ">=1.0.0 <1.3.0"
  retrofit: ^4.10.0
  riverpod_annotation: ^4.0.7
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  retrofit_generator: ^10.2.9
  riverpod_generator: ^4.0.9
  swagger_parser: ^1.44.3

flutter:
  uses-material-design: true
  generate: true
