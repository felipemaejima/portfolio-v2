<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Portfólio profissional — projetos, experiência, habilidades e contato.">
  <meta name="theme-color" content="#161826">
  <!-- Previews de link (ADR 0001: SEO zero, mas o link compartilhado tem cara) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Portfólio">
  <meta property="og:description" content="Portfólio profissional — projetos, experiência, habilidades e contato.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <style>
    /* Splash enquanto o engine carrega: mesma cor do tema, sem flash branco. */
    html, body { background: #161826; margin: 0; height: 100%; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #splash div { width: 28px; height: 28px; border: 3px solid #423A6A; border-top-color: #9184D9; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portfolio_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Portfólio</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="splash"><div></div></div>
  <script>
    window.addEventListener("flutter-first-frame", function () {
      var s = document.getElementById("splash"); if (s) s.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
