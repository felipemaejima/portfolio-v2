# DEV — carregado automaticamente por `docker compose`.
services:
  db:
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro

  api:
    build:
      target: dev
    environment:
      NODE_ENV: development
    volumes:
      - ./api:/app
      - uploads:/data/uploads
    ports:
      - "${API_PORT:-3000}:3000"

  # Toolchain Flutter. Só sobe com `--profile app` (a pasta app/ nasce na fase do app).
  app:
    image: ghcr.io/cirruslabs/flutter:${FLUTTER_VERSION:-stable}
    profiles: ["app"]
    working_dir: /app
    volumes:
      - ./app:/app
      - pub_cache:/root/.pub-cache
    command: >
      flutter run -d web-server --web-port 8080 --web-hostname 0.0.0.0
      --dart-define=API_BASE_URL=/api/v1
    stdin_open: true
    tty: true

  edge:
    volumes:
      - ./edge/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    ports:
      - "${EDGE_PORT:-80}:80"
