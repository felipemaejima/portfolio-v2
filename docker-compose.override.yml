# DEV — carregado automaticamente por `docker compose`.
services:
  db:
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro

  api:
    build:
      target: dev
    # uid/gid do host, para os arquivos criados no bind mount serem seus
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      NODE_ENV: development
    volumes:
      - ./api:/app
      - uploads:/data/uploads
    ports:
      - "${API_PORT:-3000}:3000"

  # Toolchain Flutter (tools/flutter). Só sobe com `--profile app`.
  app:
    build:
      context: ./tools/flutter
      args:
        FLUTTER_VERSION: ${FLUTTER_VERSION:-stable}
    image: portfolio-flutter
    profiles: ["app"]
    working_dir: /app
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ./app:/app
      - pub_cache:/root/.pub-cache
      - adb_keys:/root/.android   # pareamento ADB Wi-Fi sobrevive entre `run`s
    # API_BASE_URL vazio = mesma origem (o Caddy serve app e API). Os paths
    # gerados já incluem /api/v1.
    command: flutter run -d web-server --web-port 8080 --web-hostname 0.0.0.0
    stdin_open: true
    tty: true

  # Preview do build de release (make preview): responde pelo alias `app`,
  # no lugar do dev server. Só sobe com `--profile preview`.
  app-preview:
    image: caddy:2-alpine
    profiles: ["preview"]
    volumes:
      - ./app/build/web:/srv:ro
      - ./edge/Caddyfile.preview:/etc/caddy/Caddyfile:ro
    networks:
      default:
        aliases: [app]

  edge:
    volumes:
      - ./edge/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    ports:
      - "${EDGE_PORT:-80}:80"
